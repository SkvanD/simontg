<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Goodwins' Diabetic Meal Dashboard 🥗</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Outfit:wght@600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0b0f19;
            --card-bg: #161b26;
            --card-border: #232d3f;
            --accent-gold: #d4af37;
            --accent-gold-bright: #ffd700;
            --accent-cyan: #4cc9f0;
            --accent-green: #2ec4b6;
            --text-main: #f0f4f8;
            --text-secondary: #94a3b8;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            padding: 30px;
            line-height: 1.5;
        }

        .header-container {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 20px;
            margin-bottom: 30px;
            padding-bottom: 20px;
            border-bottom: 1px solid var(--card-border);
        }

        h1 {
            font-family: 'Outfit', sans-serif;
            font-size: 32px;
            font-weight: 800;
            background: linear-gradient(135deg, #ffd700, #ff9d00);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .subtitle {
            font-size: 14px;
            color: var(--text-secondary);
            margin-top: 4px;
        }

        .stats-summary {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
        }

        .stat-pill {
            background: rgba(212, 175, 55, 0.1);
            border: 1px solid rgba(212, 175, 55, 0.3);
            color: var(--accent-gold-bright);
            padding: 8px 16px;
            border-radius: 8px;
            font-size: 13.5px;
            font-weight: 600;
        }

        .controls-bar {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            margin-bottom: 25px;
            align-items: center;
        }

        .search-input {
            flex: 1;
            min-width: 250px;
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            padding: 12px 18px;
            border-radius: 10px;
            color: #fff;
            font-size: 15px;
        }

        .filter-btn {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            color: var(--text-secondary);
            padding: 10px 16px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 13.5px;
            font-weight: 600;
            transition: all 0.2s;
        }

        .filter-btn.active, .filter-btn:hover {
            background: var(--accent-gold);
            color: #000;
            border-color: var(--accent-gold);
        }

        .recipe-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 22px;
        }

        @media (max-width: 640px) {
            .recipe-grid {
                grid-template-columns: 1fr;
                gap: 16px;
            }
            .header-container {
                flex-direction: column;
                align-items: flex-start;
                gap: 12px;
                padding: 16px 20px;
            }
            .search-input {
                width: 100% !important;
            }
            .filter-bar {
                flex-wrap: wrap;
                gap: 8px;
            }
            .filter-btn {
                padding: 8px 14px;
                font-size: 13px;
            }
            .dose-box {
                padding: 8px;
            }
            .dose-item .val {
                font-size: 15px;
            }
        }

        .recipe-card {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 14px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            transition: transform 0.2s, border-color 0.2s;
        }

        .recipe-card:hover {
            transform: translateY(-4px);
            border-color: var(--accent-gold);
        }

        .card-img-wrap {
            width: 100%;
            height: 200px;
            overflow: hidden;
            position: relative;
            background: #000;
        }

        .card-img-wrap img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.3s;
        }

        .recipe-card:hover .card-img-wrap img {
            transform: scale(1.05);
        }

        .card-body {
            padding: 20px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            flex: 1;
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 10px;
            margin-bottom: 8px;
        }

        .meal-title {
            font-family: 'Outfit', sans-serif;
            font-size: 20px;
            font-weight: 700;
            color: #fff;
        }

        .badge-category {
            font-size: 11px;
            padding: 4px 10px;
            border-radius: 6px;
            background: rgba(76, 201, 240, 0.15);
            color: var(--accent-cyan);
            border: 1px solid rgba(76, 201, 240, 0.3);
            font-weight: 700;
            white-space: nowrap;
        }

        .rating-badge {
            display: inline-block;
            background: rgba(255, 215, 0, 0.15);
            border: 1px solid rgba(255, 215, 0, 0.4);
            color: var(--accent-gold-bright);
            padding: 4px 8px;
            border-radius: 6px;
            font-size: 12px;
            font-weight: 700;
            margin-top: 6px;
        }

        .dose-box {
            background: rgba(46, 196, 182, 0.1);
            border: 1px solid rgba(46, 196, 182, 0.3);
            padding: 12px;
            border-radius: 10px;
            display: flex;
            justify-content: space-around;
            margin: 14px 0;
            text-align: center;
        }

        .dose-item .val {
            font-size: 18px;
            font-weight: 800;
            color: var(--accent-green);
        }

        .dose-item .lbl {
            font-size: 11px;
            color: var(--text-secondary);
            text-transform: uppercase;
        }

        .card-meta {
            font-size: 13px;
            color: var(--text-secondary);
            margin-bottom: 12px;
        }

        .card-actions {
            display: flex;
            gap: 10px;
            margin-top: 10px;
        }

        .btn-action {
            flex: 1;
            padding: 10px;
            border-radius: 8px;
            border: 1px solid var(--card-border);
            background: rgba(255,255,255,0.05);
            color: #fff;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
        }

        .btn-action:hover {
            background: var(--accent-gold);
            color: #000;
        }

        .modal-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.85);
            z-index: 9999;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .modal-overlay.open { display: flex; }

        .modal-card {
            background: #121824;
            border: 2px solid var(--accent-gold);
            border-radius: 16px;
            max-width: 750px;
            width: 100%;
            max-height: 90vh;
            overflow-y: auto;
            padding: 35px;
            position: relative;
        }

        .modal-img-banner {
            width: 100%;
            height: 250px;
            object-fit: cover;
            border-radius: 12px;
            margin-bottom: 20px;
            border: 1px solid var(--card-border);
        }

        .close-btn {
            position: absolute;
            top: 20px; right: 25px;
            background: none; border: none;
            color: var(--text-secondary);
            font-size: 28px; cursor: pointer;
        }

        @media print {
            body * { visibility: hidden; }
            .modal-card, .modal-card * { visibility: visible; }
            .modal-card {
                position: absolute;
                left: 0; top: 0; width: 100%; max-width: 100%;
                background: #fff !important; color: #000 !important;
                border: none !important; box-shadow: none !important;
            }
            .modal-img-banner { max-height: 200px; }
            .close-btn, .no-print { display: none !important; }
            .dose-box { background: #f0f0f0 !important; border: 1px solid #ccc !important; }
            .dose-item .val { color: #000 !important; }
        }
    </style>
</head>

        const grid = document.getElementById('grid');
        const searchInput = document.getElementById('search');
        const modal = document.getElementById('modal');
        const modalContent = document.getElementById('modal-content');

        let currentFilter = 'all';

        function getStoredFeedback(id) {
            try {
                const ratings = JSON.parse(localStorage.getItem('diabetic_meal_ratings') || '{}');
                return ratings[id] || null;
            } catch(e) { return null; }
        }

        function rateMeal(id) {
            const m = MEALS.find(x => x.id === id);
            if (!m) return;

            const starsInput = prompt(`Rate ${m.name} (1 to 5 stars):\n5 = ⭐⭐⭐⭐⭐ Make again anytime!\n4 = ★★★★☆ Good\n3 = ★★★☆☆ Fine\n2 = ★★☆☆☆ Once is enough\n1 = ★☆☆☆☆ Never again`, "5");
            if (starsInput === null) return;
            const stars = parseInt(starsInput, 10);
            if (isNaN(stars) || stars < 1 || stars > 5) {
                alert("Please enter a valid rating between 1 and 5!");
                return;
            }

            const note = prompt(`Enter feedback/notes for ${m.name} (e.g. "Wife loved it, great leftovers"):`, "");

            try {
                const ratings = JSON.parse(localStorage.getItem('diabetic_meal_ratings') || '{}');
                ratings[id] = {
                    stars: stars,
                    note: note || '',
                    date: new Date().toISOString()
                };
                localStorage.setItem('diabetic_meal_ratings', JSON.stringify(ratings));
                alert(`Logged ${stars} Stars for ${m.name}! The AI will use this feedback to suggest matching recipes.`);
                renderMeals();
            } catch(e) { alert("Error saving rating: " + e); }
        }

        function renderMeals() {
            grid.innerHTML = '';
            const q = searchInput.value.toLowerCase();

            const filtered = MEALS.filter(m => {
                const matchesCat = currentFilter === 'all' || m.category === currentFilter;
                const matchesSearch = !q ||
                    m.name.toLowerCase().includes(q) ||
                    m.appliance.toLowerCase().includes(q) ||
                    m.ingredients.some(i => i.toLowerCase().includes(q));
                return matchesCat && matchesSearch;
            });

            filtered.forEach(m => {
                const fb = getStoredFeedback(m.id);
                let ratingHTML = '';
                if (fb) {
                    const starStr = '★'.repeat(fb.stars) + '☆'.repeat(5 - fb.stars);
                    ratingHTML = `<div class="rating-badge">${starStr} (${fb.stars}/5) ${fb.note ? '• ' + fb.note : ''}</div>`;
                } else {
                    ratingHTML = `<div class="rating-badge" style="background: rgba(255,255,255,0.05); color: var(--text-secondary); border-color: rgba(255,255,255,0.1);">Not Yet Rated</div>`;
                }

                const card = document.createElement('div');
                card.className = 'recipe-card';
                card.innerHTML = `
                    <div class="card-img-wrap">
                        <img src="${m.image_url}" alt="${m.name}" onerror="this.src='https://images.unsplash.com/photo-1498837167922-ddd27525d352?w=500'">
                    </div>
                    <div class="card-body">
                        <div>
                            <div class="card-header">
                                <div class="meal-title">${m.name}</div>
                                <span class="badge-category">${m.category}</span>
                            </div>
                            ${ratingHTML}
                            <div class="card-meta" style="margin-top: 10px;">
                                ⚙️ <strong>${m.appliance}</strong> • ⏱️ ${m.prep_time}
                            </div>
                            <div class="dose-box">
                                <div class="dose-item">
                                    <div class="val">${m.carbs_g}g</div>
                                    <div class="lbl">Total Carbs</div>
                                </div>
                                <div class="dose-item">
                                    <div class="val">${m.insulin_units}u</div>
                                    <div class="lbl">Insulin (÷5)</div>
                                </div>
                                <div class="dose-item">
                                    <div class="val">${m.calories_kcal}</div>
                                    <div class="lbl">Calories</div>
                                </div>
                            </div>
                            <div style="font-size: 13px; color: var(--text-secondary); line-height: 1.5; margin-bottom: 12px;">
                                ${m.notes}
                            </div>
                        </div>
                        <div class="card-actions">
                            <button class="btn-action" onclick="rateMeal('${m.id}')" style="border-color: var(--accent-gold); color: var(--accent-gold-bright);">⭐ Rate & Feedback</button>
                            <button class="btn-action" onclick="openRecipeModal('${m.id}')">📖 Recipe & Print</button>
                        </div>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        function openRecipeModal(id) {
            const m = MEALS.find(x => x.id === id);
            if (!m) return;

            const fb = getStoredFeedback(m.id);
            let ratingHTML = fb ? `⭐ Rating: ${'★'.repeat(fb.stars)} (${fb.stars}/5) - ${fb.note}` : 'Not yet rated';

            modalContent.innerHTML = `
                <button class="close-btn no-print" onclick="closeModal()">&times;</button>
                <img src="${m.image_url}" class="modal-img-banner" alt="${m.name}">
                <h2 style="font-family: 'Outfit'; font-size: 28px; margin-bottom: 6px; color: #fff;">${m.name}</h2>
                <div style="color: var(--text-secondary); margin-bottom: 18px; font-size: 14px;">
                    Category: <strong>${m.category}</strong> | Appliance: <strong>${m.appliance}</strong> | Portions: <strong>${m.portions}</strong><br>
                    <span style="color: var(--accent-gold-bright); font-weight: 600;">${ratingHTML}</span>
                </div>

                <div class="dose-box" style="margin-bottom: 25px;">
                    <div class="dose-item"><div class="val">${m.carbs_g}g</div><div class="lbl">Total Carbs</div></div>
                    <div class="dose-item"><div class="val">${m.insulin_units}u</div><div class="lbl">Insulin Dose (÷5)</div></div>
                    <div class="dose-item"><div class="val">${m.calories_kcal}</div><div class="lbl">Calories (kcal)</div></div>
                    <div class="dose-item"><div class="val">${m.protein_g}g</div><div class="lbl">Protein</div></div>
                    <div class="dose-item"><div class="val">${m.sat_fat_g}g</div><div class="lbl">Sat. Fat</div></div>
                </div>

                <h3 style="font-size: 18px; font-weight: 700; color: var(--accent-gold-bright); margin-bottom: 10px;">🛒 Ingredients</h3>
                <ul style="margin-left: 20px; margin-bottom: 22px; color: #e2e8f0; line-height: 1.7;">
                    ${m.ingredients.map(i => `<li>${i}</li>`).join('')}
                </ul>

                <h3 style="font-size: 18px; font-weight: 700; color: var(--accent-gold-bright); margin-bottom: 10px;">🍳 Step-by-Step Instructions</h3>
                <ol style="margin-left: 20px; margin-bottom: 25px; color: #e2e8f0; line-height: 1.7;">
                    ${m.instructions.map(step => `<li>${step}</li>`).join('')}
                </ol>

                <div class="no-print" style="display: flex; justify-content: flex-end; gap: 12px;">
                    <button class="btn-action" onclick="rateMeal('${m.id}')" style="background: rgba(255,215,0,0.2); color: var(--accent-gold-bright); border-color: var(--accent-gold);">⭐ Rate & Feedback</button>
                    <button class="btn-action" onclick="window.print()" style="background: var(--accent-gold); color: #000; font-weight: 700; padding: 12px 24px;">🖨️ Print Recipe Card / Save PDF</button>
                </div>
            `;
            modal.classList.add('open');
        }

        function closeModal() { modal.classList.remove('open'); }

        searchInput.addEventListener('input', renderMeals);

        document.querySelectorAll('.filter-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                currentFilter = btn.getAttribute('data-filter');
                renderMeals();
            });
        });

        renderMeals();
    </script>
</body>
