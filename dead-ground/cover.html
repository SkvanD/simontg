<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dead Ground — Cover</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #080c14;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    font-family: Georgia, 'Times New Roman', serif;
  }
  .cover {
    width: 600px;
    height: 900px;
    position: relative;
    overflow: hidden;
    box-shadow: 0 0 80px rgba(0,0,0,0.9);
  }
  .fade-bottom {
    position: absolute;
    inset: 0;
    background: linear-gradient(
      to bottom,
      rgba(5,8,15,0)    0%,
      rgba(5,8,15,0)    62%,
      rgba(5,8,15,0.55) 76%,
      rgba(5,8,15,0.95) 88%,
      rgba(5,8,15,1)    100%
    );
    z-index: 2;
  }
  .label-top {
    position: absolute;
    top: 28px; left: 44px;
    font-size: 11px;
    letter-spacing: .28em;
    text-transform: uppercase;
    color: #80cc98;
    z-index: 4;
  }
  .text-layer {
    position: absolute;
    inset: 0; z-index: 3;
    display: flex;
    flex-direction: column;
    justify-content: flex-end;
    padding: 0 44px 52px;
  }
  .tagline {
    font-size: 15px;
    color: #b0ccc0;
    font-style: italic;
    letter-spacing: .04em;
    margin-bottom: 22px;
    line-height: 1.7;
    text-shadow: 0 1px 10px #000, 0 0 20px #000;
  }
  .title {
    font-size: 90px;
    font-weight: normal;
    letter-spacing: .12em;
    color: #f4ece0;
    line-height: .9;
    margin-bottom: 18px;
    text-shadow: 0 2px 20px #000, 0 0 50px #000;
  }
  .subtitle {
    font-size: 15px;
    letter-spacing: .24em;
    text-transform: uppercase;
    color: #80cc98;
    margin-bottom: 40px;
    padding-bottom: 18px;
    border-bottom: 1px solid #2a5038;
  }
  .byline {
    font-size: 11px;
    letter-spacing: .18em;
    text-transform: uppercase;
    color: #3a6050;
  }
</style>
</head>
<body>
<div class="cover">

<svg viewBox="0 0 600 900" xmlns="http://www.w3.org/2000/svg"
     width="600" height="900" style="position:absolute;inset:0;display:block">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#1a4070"/>
      <stop offset="28%"  stop-color="#2a5888"/>
      <stop offset="55%"  stop-color="#3a6878"/>
      <stop offset="78%"  stop-color="#3a5860"/>
      <stop offset="100%" stop-color="#243828"/>
    </linearGradient>
    <linearGradient id="tarn-fill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#6aaad0"/>
      <stop offset="100%" stop-color="#3a7098"/>
    </linearGradient>
    <radialGradient id="moon-halo" cx="65%" cy="13%" r="30%">
      <stop offset="0%"   stop-color="#90c0e0" stop-opacity=".5"/>
      <stop offset="100%" stop-color="#1a4070" stop-opacity="0"/>
    </radialGradient>
    <filter id="blur2"><feGaussianBlur stdDeviation="2"/></filter>
    <filter id="blur5"><feGaussianBlur stdDeviation="5"/></filter>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- ── SKY — genuinely bright enough to read ── -->
  <rect width="600" height="900" fill="url(#sky)"/>
  <rect width="600" height="900" fill="url(#moon-halo)"/>

  <!-- Stars — white, clearly visible against blue -->
  <circle cx="75"  cy="42"  r="1.8" fill="#e0eeff" opacity=".95"/>
  <circle cx="148" cy="22"  r="1.2" fill="#d0e8ff" opacity=".8"/>
  <circle cx="228" cy="60"  r="2.0" fill="#e8f4ff" opacity="1"/>
  <circle cx="310" cy="18"  r="1.3" fill="#d8eeff" opacity=".85"/>
  <circle cx="362" cy="50"  r="1.6" fill="#e0eeff" opacity=".9"/>
  <circle cx="448" cy="30"  r="1.1" fill="#d0e8ff" opacity=".75"/>
  <circle cx="528" cy="55"  r="1.8" fill="#e8f4ff" opacity=".95"/>
  <circle cx="568" cy="24"  r="1.0" fill="#d0e8ff" opacity=".7"/>
  <circle cx="52"  cy="88"  r="1.1" fill="#d8eeff" opacity=".65"/>
  <circle cx="490" cy="75"  r="1.4" fill="#e0eeff" opacity=".8"/>
  <circle cx="175" cy="92"  r="0.9" fill="#d0e8ff" opacity=".6"/>
  <circle cx="395" cy="80"  r="1.2" fill="#e0eeff" opacity=".75"/>
  <circle cx="258" cy="32"  r="1.0" fill="#d8eeff" opacity=".7"/>
  <circle cx="112" cy="68"  r="1.4" fill="#e0eeff" opacity=".8"/>

  <!-- Moon — bright white, prominent -->
  <circle cx="388" cy="102" r="50"  fill="#2a5888" filter="url(#blur5)" opacity=".5"/>
  <circle cx="388" cy="102" r="32"  fill="#6a90b0"/>
  <circle cx="388" cy="102" r="24"  fill="#90b8d0"/>
  <circle cx="388" cy="102" r="18"  fill="#b8d4e8"/>
  <circle cx="388" cy="102" r="12"  fill="#d8eaf8"/>
  <ellipse cx="384" cy="97"  rx="5" ry="4" fill="#e8f4ff" opacity=".6"/>

  <!-- Clouds — mid-blue grey, visible -->
  <ellipse cx="130" cy="142" rx="188" ry="50" fill="#2e4a68" opacity=".75"/>
  <ellipse cx="450" cy="118" rx="170" ry="44" fill="#283e58" opacity=".7"/>
  <ellipse cx="290" cy="190" rx="280" ry="58" fill="#263c52" opacity=".6"/>
  <ellipse cx="62"  cy="200" rx="118" ry="36" fill="#2a4260" opacity=".55"/>
  <ellipse cx="515" cy="178" rx="132" ry="34" fill="#263852" opacity=".5"/>

  <!-- ── FAR FELLS — dark silhouette against bright sky ── -->
  <polygon points="0,498 0,292 68,256 138,275 208,242 290,264 372,235 454,258 532,240 600,260 600,498"
           fill="#0c1a10"/>

  <!-- ── MID FELLS — main dramatic shapes, almost black ── -->
  <polygon points="0,612 0,342 50,305 108,326 165,272 218,303 255,260 300,290 338,263 360,286 378,612"
           fill="#091208"/>
  <polygon points="220,622 275,275 318,308 357,260 398,293 444,270 484,305 518,622"
           fill="#07100a"/>
  <polygon points="468,622 505,292 548,310 586,288 600,302 600,622"
           fill="#091208"/>

  <!-- Valley floor -->
  <polygon points="0,622 600,622 600,568 528,550 442,560 356,546 270,556 184,543 98,553 18,546 0,554"
           fill="#060c06"/>

  <!-- ── TARN — bright reflective blue, clearly visible ── -->
  <ellipse cx="300" cy="654" rx="252" ry="63" fill="url(#tarn-fill)"/>
  <!-- Tarn surface sheen -->
  <ellipse cx="300" cy="642" rx="250" ry="50" fill="none" stroke="#5a88a8" stroke-width="2"   opacity=".6"/>
  <ellipse cx="300" cy="652" rx="212" ry="38" fill="none" stroke="#4a7898" stroke-width="1.5" opacity=".5"/>
  <ellipse cx="296" cy="661" rx="162" ry="24" fill="none" stroke="#3a6888" stroke-width="1"   opacity=".4"/>
  <ellipse cx="292" cy="669" rx="108" ry="14" fill="none" stroke="#3a6888" stroke-width="1"   opacity=".3"/>
  <!-- Moon column on water - bright -->
  <ellipse cx="335" cy="645" rx="35"  ry="14" fill="#c0dff0" opacity=".5" filter="url(#blur2)"/>
  <ellipse cx="335" cy="645" rx="16"  ry="6"  fill="#e0f0ff" opacity=".55"/>
  <line    x1="333" y1="648" x2="328" y2="690" stroke="#a0ccec" stroke-width="3" opacity=".4"/>

  <!-- Shore -->
  <polygon points="0,900 0,712 88,696 188,703 288,691 388,700 488,689 588,697 600,695 600,900"
           fill="#040804"/>

  <!-- ── ODG building — warm glowing windows ── -->
  <ellipse cx="104" cy="622" rx="65" ry="18" fill="#4a2c08" opacity=".2" filter="url(#blur5)"/>
  <rect x="58"  y="576" width="94" height="56" fill="#1e2c18" rx="1"/>
  <polygon points="49,576 105,553 161,576" fill="#182210"/>
  <polygon points="80,576 100,564 120,576" fill="#141e0e"/>
  <!-- Windows — bold warm amber -->
  <rect x="68"  y="586" width="14" height="18" fill="#c06018" rx="1"/>
  <rect x="88"  y="586" width="14" height="18" fill="#d87020" rx="1"/>
  <rect x="108" y="586" width="14" height="18" fill="#b05818" rx="1"/>
  <rect x="128" y="586" width="11" height="18" fill="#904808" rx="1"/>
  <!-- Window glow -->
  <rect x="68"  y="586" width="14" height="18" fill="#ff9030" rx="1" opacity=".4" filter="url(#blur2)"/>
  <rect x="88"  y="586" width="14" height="18" fill="#ff9030" rx="1" opacity=".45" filter="url(#blur2)"/>
  <!-- Door -->
  <rect x="102" y="606" width="16" height="26" fill="#0e140c" rx="1"/>
  <!-- Wall -->
  <rect x="40" y="630" width="142" height="5" fill="#1a2414" rx="1"/>
  <!-- Light spill -->
  <ellipse cx="108" cy="634" rx="14" ry="5" fill="#804010" opacity=".18"/>

  <!-- Figure — clearly visible silhouette -->
  <line x1="184" y1="664" x2="184" y2="646" stroke="#5a7858" stroke-width="4"/>
  <circle cx="184" cy="641" r="5.5" fill="#5a7858"/>
  <line   x1="187" y1="655" x2="194" y2="667" stroke="#4a6848" stroke-width="2.5"/>

  <!-- Rain — blue, clearly visible -->
  <g stroke="#5a88b0" stroke-width="1.2" opacity=".4">
    <line x1="35"  y1="0"   x2="26"  y2="105"/>
    <line x1="105" y1="20"  x2="96"  y2="125"/>
    <line x1="172" y1="0"   x2="163" y2="105"/>
    <line x1="245" y1="30"  x2="236" y2="135"/>
    <line x1="320" y1="10"  x2="311" y2="115"/>
    <line x1="395" y1="0"   x2="386" y2="105"/>
    <line x1="465" y1="22"  x2="456" y2="127"/>
    <line x1="535" y1="8"   x2="526" y2="113"/>
    <line x1="70"  y1="122" x2="61"  y2="227"/>
    <line x1="150" y1="140" x2="141" y2="245"/>
    <line x1="268" y1="105" x2="259" y2="210"/>
    <line x1="375" y1="125" x2="366" y2="230"/>
    <line x1="480" y1="112" x2="471" y2="217"/>
    <line x1="565" y1="132" x2="556" y2="237"/>
    <line x1="22"  y1="230" x2="13"  y2="335"/>
    <line x1="195" y1="242" x2="186" y2="347"/>
    <line x1="345" y1="218" x2="336" y2="323"/>
    <line x1="495" y1="235" x2="486" y2="340"/>
  </g>
</svg>

<div class="fade-bottom"></div>
<div class="label-top">A Choose Your Own Story</div>
<div class="text-layer">
  <div class="tagline">
    You weren't looking for trouble.<br>
    But trouble found you in the Lake District.
  </div>
  <div class="title">DEAD<br>GROUND</div>
  <div class="subtitle">A Lake District Story</div>
  <div class="byline">Interactive &nbsp;·&nbsp; Choose Your Own Path</div>
</div>

</div>
</body>
</html>
